name: finsight
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
      SUPABASE_JWT_ISSUER_URI: ${SUPABASE_JWT_ISSUER_URI:-}
      SUPABASE_JWT_JWK_SET_URI: ${SUPABASE_JWT_JWK_SET_URI:-}
      FINSIGHT_ALLOWED_ORIGINS: ${FINSIGHT_ALLOWED_ORIGINS:-http://localhost:5173}
